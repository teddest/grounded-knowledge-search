name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: pnpm

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
          enable-cache: true

      - name: Install Playwright browser
        run: pnpm --filter @grounded/web exec playwright install --with-deps chromium

      - name: Run repository quality checks
        run: ./scripts/check.sh
