services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: search
      POSTGRES_USER: search
      POSTGRES_PASSWORD: search
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U search -d search"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://search:search@db:5432/search
      REPOSITORY_ROOT: /workspace/repository
      API_CORS_ORIGINS: '["http://localhost:${WEB_PORT:-3000}"]'
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/workspace/apps/api
      - .:/workspace/repository:ro
      - api_venv:/workspace/apps/api/.venv
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      WATCHPACK_POLLING: "true"
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/workspace/apps/web
      - ./packages:/workspace/packages
      - web_node_modules:/workspace/node_modules
      - web_next:/workspace/apps/web/.next
    depends_on:
      api:
        condition: service_started

volumes:
  api_venv:
  postgres_data:
  web_next:
  web_node_modules:
